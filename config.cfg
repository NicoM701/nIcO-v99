// ------------------------------------------------------
// NORMAL BUY ALIASES
// ------------------------------------------------------
alias n_buy_defuser        "buy defuser"
alias n_buy_armor          "buy vest; buy vesthelm; buy vest"
alias n_buy_nades          "buy smokegrenade; buy molotov; buy incgrenade; buy hegrenade; buy flashbang"
alias n_buy_startpistol    "buy usp_silencer; buy glock; buy hkp2000"
alias n_buy_zeus           "buy taser"
alias n_buy_m4a1s_ak       "buy m4a1_silencer; buy ak47"
alias n_buy_awp            "buy awp"
alias n_buy_galil_famas    "buy galilar; buy famas"
alias n_buy_m4a4           "buy m4a1"
alias n_buy_tec57          "buy fiveseven; buy tec9"
alias n_buy_deagle         "buy deagle"
alias n_buy_p250           "buy p250"
alias n_buy_mac_mp9        "buy mp9; buy mac10"
alias n_refund_all         "sellbackall; sellbackall"

// ------------------------------------------------------
// DONATE BUY ALIASES
// buy x N x = Donate-Buy über Loadout-Slot
// ------------------------------------------------------
alias d_buy_nades          "buy x 26 x; buy x 27 x; buy x 28 x; buy x 29 x; buy x 31 x"
alias d_buy_zeus           "buy x 34 x"   // EQUIPMENT2: Zeus

alias d_buy_startpistol    "buy x 2 x"    // CT: USP-S/P2000 / T: Glock
alias d_buy_m4a1s_ak       "buy x 14 x"   // CT: M4A1-S / T: AK
alias d_buy_awp            "buy x 18 x"   // CT/T: AWP
alias d_buy_famas_auto     "buy x 16 x"   // CT: FAMAS / T: Auto Sniper
alias d_buy_m4a4_galil     "buy x 15 x"   // CT: M4A4 / T: Galil
alias d_buy_tec57          "buy x 5 x"    // CT: Five-SeveN / T: Tec-9
alias d_buy_deagle         "buy x 6 x"    // CT/T: Deagle
alias d_buy_p250           "buy x 3 x"    // CT/T: P250
alias d_buy_mac_mp9        "buy x 8 x"    // CT: MP9 / T: MAC-10

// ------------------------------------------------------
// NORMAL NUMPAD BINDS
