bind "kp_4"        "n_buy_galil_famas"
bind "kp_5"        "n_buy_m4a4"
bind "kp_6"        "n_buy_tec57"
bind "kp_7"        "n_buy_deagle"
bind "kp_8"        "n_buy_p250"
bind "kp_9"        "n_buy_mac_mp9"
bind "kp_plus"     "n_refund_all"

// ------------------------------------------------------
// CTRL LAYER
// Hold CTRL: weapon/nade/equipment numpad binds become donate-buys.
// Release CTRL: normal buybinds restored.
// ------------------------------------------------------
alias +n_ctrl_donate "+sprint; bind kp_divide d_buy_startpistol; bind kp_multiply d_buy_zeus; bind kp_1 d_buy_nades; bind kp_2 d_buy_m4a1s_ak; bind kp_3 d_buy_awp; bind kp_4 d_buy_famas_auto; bind kp_5 d_buy_m4a4_galil; bind kp_6 d_buy_tec57; bind kp_7 d_buy_deagle; bind kp_8 d_buy_p250; bind kp_9 d_buy_mac_mp9"
alias -n_ctrl_donate "-sprint; bind kp_divide n_buy_startpistol; bind kp_multiply n_buy_zeus; bind kp_1 n_buy_nades; bind kp_2 n_buy_m4a1s_ak; bind kp_3 n_buy_awp; bind kp_4 n_buy_galil_famas; bind kp_5 n_buy_m4a4; bind kp_6 n_buy_tec57; bind kp_7 n_buy_deagle; bind kp_8 n_buy_p250; bind kp_9 n_buy_mac_mp9"
bind "ctrl" "+n_ctrl_donate"
