bind "kp_divide"   "n_buy_startpistol"
bind "kp_multiply" "n_buy_zeus"
bind "kp_del"      "n_buy_defuser"
bind "kp_0"        "n_buy_armor"
bind "kp_1"        "n_buy_nades"
bind "kp_2"        "n_buy_m4a1s_ak"
